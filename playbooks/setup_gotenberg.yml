---
# Playbook: setup_gotenberg.yml
#
# Provisiona o Gotenberg (API HTTP stateless de conversão HTML→PDF via
# Chromium) na VPS. Instância ÚNICA servindo staging + prod — o Gotenberg
# não persiste nada; os templates HTML (que variam por ambiente) vivem na
# aerobi-api. Decisão registrada em roles/gotenberg/README.md.
#
# Serviço interno: NENHUMA porta publicada no host, sem vhost/DNS/TLS e sem
# secret no vault. As APIs consomem via rede warpgate: http://gotenberg:3000.
#
# PRÉ-REQUISITOS:
#   1. setup_vps.yml executado (Docker instalado) — a rede warpgate é
#      auto-satisfeita pelo role docker_network incluído abaixo.
#
# Uso:
#   ansible-playbook -i inventory/prod playbooks/setup_gotenberg.yml
#
# Pós-playbook (fora do Ansible — ver roles/gotenberg/README.md):
#   1. Smoke test de dentro de um container da rede warpgate:
#        docker exec aerobi-api sh -c \
#          'wget -qO- http://gotenberg:3000/health || curl -s http://gotenberg:3000/health'
#   2. Criar o secret consumido pela aerobi-api (mesma URL p/ staging e prod;
#      se o deploy usar GitHub Environments, criar em ambos):
#        gh secret set GOTENBERG_URL --repo atzaero/aerobi-api --body "http://gotenberg:3000"

- name: Provisionar Gotenberg (HTML→PDF via Chromium)
  hosts: all
  become: yes

  pre_tasks:
    - name: Validar pin da imagem do Gotenberg
      fail:
        msg: >
          gotenberg_version precisa ser uma tag pinada (não 'latest' nem
          vazia). Revise https://github.com/gotenberg/gotenberg/releases e
          valide com `docker manifest inspect` antes de aplicar.
      when: gotenberg_version | default('') in ['latest', '', None]

    - name: Exibir configuração que será aplicada
      debug:
        msg:
          - "============================================"
          - "  Provisionando Gotenberg"
          - "============================================"
          - "  Imagem     : {{ gotenberg_image }}:{{ gotenberg_version }}"
          - "  Container  : {{ gotenberg_container_name }}"
          - "  Rede       : {{ docker_network_name }} (NENHUMA porta no host)"
          - "  Recursos   : shm_size={{ gotenberg_shm_size }} | memory={{ gotenberg_memory_limit }}"
          - "  URL interna: http://{{ gotenberg_container_name }}:{{ gotenberg_port }} (staging + prod)"
          - "============================================"

  roles:
    - role: docker_network
      tags: [network]

    - role: gotenberg
      tags: [gotenberg]

  post_tasks:
    # Sem porta publicada no host, o wait_for 127.0.0.1 padrão das outras
    # roles não se aplica — a saúde é validada pelo healthcheck nativo
    # (GET /health) via docker_container_info + retry.
    - name: Aguardar Gotenberg ficar saudável (healthcheck /health)
      community.docker.docker_container_info:
        name: "{{ gotenberg_container_name }}"
      register: gotenberg_info
      until: gotenberg_info.container.State.Health.Status == "healthy"
      retries: 12
      delay: 5

    - name: Exibir resumo final
      debug:
        msg:
          - "============================================"
          - "  Gotenberg provisionado com sucesso!"
          - "============================================"
          - "  Status      : {{ gotenberg_info.container.State.Status }} | Health: {{ gotenberg_info.container.State.Health.Status }}"
          - "  URL interna : http://{{ gotenberg_container_name }}:{{ gotenberg_port }} (warpgate; staging + prod)"
          - "  Porta host  : nenhuma (`docker port {{ gotenberg_container_name }}` deve ser vazio)"
          - "============================================"
          - "  Próximos passos:"
          - "  1. Smoke: docker exec aerobi-api sh -c 'wget -qO- http://gotenberg:3000/health'"
          - "  2. gh secret set GOTENBERG_URL --repo atzaero/aerobi-api --body 'http://gotenberg:3000'"
          - "============================================"
